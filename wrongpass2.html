<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wrong Passcode ♡</title>

    <link rel="stylesheet" href="pass.css">
    <link rel="stylesheet" href="wrongpass.css">
</head>

<body>

    <main class="passcode-page wrong-pass-page">

        <!-- HOME BUTTON -->
        <a href="index.html" class="home-button" aria-label="Home">

            <svg viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5"></path>
                <path d="M5.5 9.5V21h13V9.5"></path>
                <path d="M9.5 21v-7h5v7"></path>
            </svg>

        </a>


        <!-- =========================
             LEFT SIDE
        ========================== -->

        <section class="passcode-image">

            <img
                src="assets/images/bill_landscape2.jpg"
                alt="Billiards">

        </section>


        <!-- =========================
             RIGHT SIDE
        ========================== -->

        <section class="passcode-panel">

            <div class="passcode-content">

                <p class="small-text">
                    ONE LITTLE SECRET
                </p>


                <h1>
                    Enter the<br>passcode
                </h1>


                <div class="heart-divider">
                    ♡
                </div>


                <!-- PASSCODE DISPLAY -->
                <div class="passcode-display">

                    <span>_</span>
                    <span>_</span>
                    <span>_</span>
                    <span>_</span>

                </div>


                <!-- HINT -->
                <p class="hint">
                    Hint: Hi
                </p>


                <!-- =========================
                     NUMBER BALLS
                ========================== -->

                <div class="number-pad">

                    <!-- 1 -->
                    <button class="ball-button">
                        <img
                            src="assets/images/1.png"
                            alt="1">
                    </button>


                    <!-- 2 -->
                    <button class="ball-button">
                        <img
                            src="assets/images/2.png"
                            alt="2">
                    </button>


                    <!-- 3 -->
                    <button class="ball-button">
                        <img
                            src="assets/images/3.png"
                            alt="3">
                    </button>


                    <!-- 4 -->
                    <button class="ball-button">
                        <img
                            src="assets/images/4.png"
                            alt="4">
                    </button>


                    <!-- 5 -->
                    <button class="ball-button">
                        <img
                            src="assets/images/5.png"
                            alt="5">
                    </button>


                    <!-- 6 -->
                    <button class="ball-button">
                        <img
                            src="assets/images/6.png"
                            alt="6">
                    </button>


                    <!-- 7 -->
                    <button class="ball-button">
                        <img
                            src="assets/images/7.png"
                            alt="7">
                    </button>


                    <!-- 8 -->
                    <button class="ball-button">
                        <img
                            src="assets/images/8.png"
                            alt="8">
                    </button>


                    <!-- 9 -->
                    <button class="ball-button">
                        <img
                            src="assets/images/9.png"
                            alt="9">
                    </button>


                    <!-- 0 -->
                    <button class="ball-button zero-button">
                        <img
                            src="assets/images/0.png"
                            alt="0">
                    </button>


                    <!-- CLEAR ICON -->
                    <button
                        class="clear-button"
                        aria-label="Clear">

                        <svg viewBox="0 0 24 24">

                            <path d="M3.5 16.5l9-9 5 5-9 9h-5z"></path>

                            <path d="M14 7l2-2a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3l-2 2"></path>

                            <path d="M3.5 20h17"></path>

                        </svg>

                    </button>

                </div>

            </div>

        </section>


        <!-- =========================
             DARKEN / BLUR BACKGROUND
        ========================== -->

        <div class="wrong-overlay"></div>


        <!-- =========================
             FRONT IMAGE
        ========================== -->

        <div class="mali-overlay">

            <img
                src="assets/images/mali.png"
                alt="Wrong passcode">

        </div>

    </main>



    <script>

        document.addEventListener("keydown", function () {

            window.location.href = "pass.html";

        });


        document.addEventListener("click", function () {

            window.location.href = "pass.html";

        });

    </script>

</body>

</html>
